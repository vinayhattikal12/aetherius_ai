version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aetherius_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aetherius
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - aetherius_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aetherius"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aetherius_pgdata:
    driver: local
